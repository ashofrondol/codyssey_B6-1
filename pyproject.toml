# 이 저장소의 파이썬 쪽 규격을 한 곳에 선언한다.
#
# 산출물 자체는 Bash + AWS CLI 이고, 파이썬은 판정 로직(infra/check_sg.py)과
# 테스트에만 쓴다. 그래서 설치되는 패키지는 없고, 여기 있는 것은
# "무엇으로 실행해야 재현되는가" 뿐이다.
#
# 검증:
#   python3 -m unittest discover -s tests -t tests -v   # 의존성 0개로 돈다
#   python3 -m pytest -q                                # pytest 가 있으면 이것도 된다

[project]
name = "codyssey-b6-1"
version = "1.0.0"
description = "VPC + Public Subnet + EC2(nginx) 를 스크립트로 구축·검증·정리한다"
requires-python = ">=3.9"

# 런타임 의존성 없음 — 과제 제약상 파이썬 코드는 표준 라이브러리만 쓴다.
# 선언은 아무것도 막지 못하므로 검사로 강제한다 —
# tests/test_infra.py 의 test_infra_와_tests_는_표준_라이브러리만_쓴다.
dependencies = []

[project.optional-dependencies]
# 테스트는 unittest 로 작성돼 있어 pytest 없이도 전부 돈다.
# pytest 는 실행기일 뿐이므로 필수가 아니라 선택 의존성이다.
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts 는 두지 않는다. 채점자가 치는 `python3 -m pytest -q` 에 -q 가 겹치면
# -qq 가 되어 "55 passed" 요약 줄이 사라진다 — 통과 개수를 보려고 치는 명령인데.

[tool.ruff]
line-length = 110
target-version = "py39"
