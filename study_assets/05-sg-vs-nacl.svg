<svg xmlns="http://www.w3.org/2000/svg" width="840" height="488" viewBox="0 0 840 488" role="img" aria-labelledby="title desc">
<title id="title">보안 그룹 vs NACL — 서 있는 곳과 기억력이 다르다</title>
<desc id="desc">NACL 은 서브넷 경계에서 번호 순으로 허용·거부 규칙을 검사하고, 보안 그룹은 인스턴스(ENI)에 붙어 허용 규칙만 가진다. 보안 그룹은 이 과제의 SSH 흐름(tcp 22 ← 198.51.100.7/32)처럼 추적하는 연결의 응답을 규칙 확인 없이 내보내지만, NACL 은 기억하지 않아 응답 방향(아웃바운드 1024-65535) 규칙이 없으면 응답을 버린다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="840" height="488"/>
<text class="th" x="24" y="36">보안 그룹 vs NACL — 서 있는 곳과 기억력이 다르다</text>
<text class="ts" x="24" y="58">초록 = 통과 · 빨강 = 버림 · 이 과제는 NACL 을 만들지 않았다(기본 NACL = 전부 허용)</text>

<rect class="zone" x="212" y="76" width="604" height="136" rx="12"/>
<text class="ts" x="800" y="98" text-anchor="end">Public Subnet <tspan class="mono">10.0.1.0/24</tspan></text>

<rect class="box" x="324" y="104" width="468" height="96" rx="10"/>
<text class="tb" x="340" y="128">Security Group</text>
<text class="ts" x="340" y="148">인스턴스(ENI)에 붙음 · 허용 규칙만</text>

<rect class="box" x="604" y="120" width="172" height="64" rx="8"/>
<text class="tb" x="690" y="146" text-anchor="middle">EC2 · nginx</text>
<text class="mono" x="690" y="168" text-anchor="middle">:80</text>

<line class="ln ln-blue" x1="24" y1="176" x2="136" y2="176" marker-end="url(#arrow-blue)"/>
<text class="tb c-blue" x="32" y="164">요청</text>
<line class="ln ln-blue" x1="286" y1="176" x2="600" y2="176" marker-end="url(#arrow-blue)"/>

<rect class="box" x="140" y="108" width="146" height="100" rx="10"/>
<text class="tb" x="213" y="134" text-anchor="middle">NACL</text>
<text class="ts" x="213" y="156" text-anchor="middle">서브넷 경계</text>
<text class="ts" x="213" y="175" text-anchor="middle">번호 순 검사</text>
<text class="ts" x="213" y="194" text-anchor="middle">허용 + 거부</text>

<text class="tb" x="24" y="248">A. 보안 그룹 — stateful (연결을 기억)</text>
<text class="ts" x="816" y="248" text-anchor="end">예: 이 과제의 SSH — 소스가 /32 라 추적된다</text>
<rect class="green" x="24" y="260" width="380" height="60" rx="8"/>
<text class="tb c-green" x="40" y="284">① 요청 들어옴 (tcp 22)</text>
<text x="40" y="306">규칙 <tspan class="mono">tcp 22 ← 198.51.100.7/32</tspan> ✔</text>
<line class="ln ln-green" x1="404" y1="290" x2="432" y2="290" marker-end="url(#arrow-green)"/>
<rect class="green" x="436" y="260" width="380" height="60" rx="8"/>
<text class="tb c-green" x="452" y="284">② 응답 나감 <tspan class="mono">:22 → :51514</tspan></text>
<text x="452" y="306">추적 중인 연결 → 규칙 확인 없이 ✔</text>

<text class="tb" x="24" y="356">B. NACL — stateless (기억 없음 · 가상의 커스텀 NACL 예)</text>
<rect class="green" x="24" y="368" width="380" height="82" rx="8"/>
<text class="tb c-green" x="40" y="392">① 요청 들어옴 (tcp 80)</text>
<text x="40" y="414">인바운드 규칙</text>
<text class="mono" x="40" y="436">100 ALLOW tcp 80 0.0.0.0/0 ✔</text>
<line class="ln ln-red" x1="404" y1="409" x2="432" y2="409" marker-end="url(#arrow-red)"/>
<rect class="red" x="436" y="368" width="380" height="82" rx="8"/>
<text class="tb c-red" x="452" y="392">② 응답 나감 <tspan class="mono">:80 → :51514</tspan></text>
<text x="452" y="414">기억이 없어 아웃바운드 규칙을 다시 검사</text>
<text x="452" y="436"><tspan class="mono">1024-65535</tspan> 허용 줄이 없으면 ✘ 버림</text>

<text class="ts" x="24" y="472">그래서 NACL 을 직접 만들면 응답이 나갈 길(임시 포트 1024-65535)도 따로 열어야 한다</text>
</svg>
