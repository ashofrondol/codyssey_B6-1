<svg xmlns="http://www.w3.org/2000/svg" width="860" height="534" viewBox="0 0 860 534" role="img" aria-labelledby="title desc">
<title id="title">스크립트 5개와 상태 파일 — 누가 무엇을 쓰고 읽나</title>
<desc id="desc">01_network.sh → 02_security_group.sh → 03_instance.sh → 04_verify.sh → 99_cleanup.sh 순으로 실행하고, 모두 00_env.sh 를 source 한다. 01~03 은 만든 리소스 ID 를 infra/.state 에 KEY=VALUE 로 적고, 04 는 그 ID 를 읽어 판정만 하며, 99 는 그 ID 로 역순 삭제한 뒤 .state 를 지운다. 02 와 04 는 보안 그룹 판정을 check_sg.py 하나에 맡기고, 04 는 --tally-file 로 PASS·FAIL 건수("4 0")를 받는다. 테스트에서는 tests/fake_aws.py 가 aws 명령을 대신한다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="860" height="534"/>
<text class="th" x="24" y="36">스크립트 5개와 상태 파일 — 누가 무엇을 쓰고 읽나</text>
<text class="ts" x="24" y="58">파랑 = 실행 순서 · 보라 = infra/.state · 초록 = 판정 결과</text>

<!-- 00_env.sh -->
<rect class="zone" x="24" y="72" width="812" height="54" rx="10"/>
<text x="40" y="94"><tspan class="mono tb">00_env.sh</tspan><tspan class="ts"> — 모든 스크립트가 맨 앞에서 source 하는 공통 설정·도구</tspan></text>
<text x="40" y="115" class="mono">AWS_REGION · tag_spec() · aws_() · ensure() · state_set / state_get</text>

<!-- check_sg.py 와 결과 -->
<rect class="box" x="396" y="148" width="130" height="48" rx="8"/>
<text x="461" y="168" text-anchor="middle" class="mono tb">check_sg.py</text>
<text x="461" y="187" text-anchor="middle" class="ts">보안 그룹 판정</text>

<rect class="green" x="596" y="144" width="240" height="52" rx="8"/>
<text x="610" y="165"><tspan class="tb c-green">결과</tspan><tspan class="ts"> — 모두 통과할 때의 목표 모양</tspan></text>
<text x="610" y="186" class="mono">결과: PASS 18 / FAIL 0 / SKIP 0</text>

<path class="ln" d="M330,243 V172 H392" marker-end="url(#arrow)"/>
<text x="322" y="206" text-anchor="end" class="mono">IpPermissions JSON</text>
<text x="322" y="225" text-anchor="end" class="ts">위반이면 die (멈춤)</text>
<path class="ln" d="M568,243 V172 H530" marker-end="url(#arrow)"/>
<text x="560" y="225" text-anchor="end" class="mono">--tally-file → "4 0"</text>
<line class="ln ln-green" x1="650" y1="243" x2="650" y2="200" marker-end="url(#arrow-green)"/>

<!-- 스크립트 5개 -->
<rect class="blue" x="24" y="244" width="133" height="70" rx="10"/>
<text x="90" y="272" text-anchor="middle" class="mono c-blue">01_network.sh</text>
<text x="90" y="294" text-anchor="middle" class="ts">네트워크 생성</text>
<rect class="blue" x="179" y="244" width="190" height="70" rx="10"/>
<text x="274" y="272" text-anchor="middle" class="mono c-blue">02_security_group.sh</text>
<text x="274" y="294" text-anchor="middle" class="ts">SG 생성 · 자기 점검</text>
<rect class="blue" x="391" y="244" width="141" height="70" rx="10"/>
<text x="461" y="272" text-anchor="middle" class="mono c-blue">03_instance.sh</text>
<text x="461" y="294" text-anchor="middle" class="ts">EC2 · nginx</text>
<rect class="blue" x="554" y="244" width="125" height="70" rx="10"/>
<text x="616" y="266" text-anchor="middle" class="mono c-blue">04_verify.sh</text>
<text x="616" y="286" text-anchor="middle" class="ts">판정만</text>
<text x="616" y="304" text-anchor="middle" class="ts">(만들지 않음)</text>
<rect class="blue" x="701" y="244" width="135" height="70" rx="10"/>
<text x="768" y="266" text-anchor="middle" class="mono c-blue">99_cleanup.sh</text>
<text x="768" y="286" text-anchor="middle" class="ts">역순 삭제</text>
<text x="768" y="304" text-anchor="middle" class="ts">잔여 확인</text>

<line class="ln ln-blue" x1="158" y1="279" x2="175" y2="279" marker-end="url(#arrow-blue)"/>
<line class="ln ln-blue" x1="370" y1="279" x2="387" y2="279" marker-end="url(#arrow-blue)"/>
<line class="ln ln-blue" x1="533" y1="279" x2="550" y2="279" marker-end="url(#arrow-blue)"/>
<line class="ln ln-blue" x1="680" y1="279" x2="697" y2="279" marker-end="url(#arrow-blue)"/>

<!-- 쓰기 / 읽기 -->
<line class="ln ln-purple" x1="90" y1="315" x2="90" y2="356" marker-end="url(#arrow-purple)"/>
<text x="98" y="341" class="ts c-purple">씀</text>
<line class="ln ln-purple" x1="274" y1="315" x2="274" y2="356" marker-end="url(#arrow-purple)"/>
<text x="282" y="341" class="ts c-purple">씀</text>
<line class="ln ln-purple" x1="461" y1="315" x2="461" y2="356" marker-end="url(#arrow-purple)"/>
<text x="469" y="341" class="ts c-purple">씀</text>
<line class="ln ln-purple" x1="616" y1="359" x2="616" y2="318" marker-end="url(#arrow-purple)"/>
<text x="608" y="341" text-anchor="end" class="ts c-purple">읽음</text>
<line class="ln ln-purple" x1="768" y1="359" x2="768" y2="318" marker-end="url(#arrow-purple)"/>
<text x="760" y="341" text-anchor="end" class="ts c-purple">읽음 · 끝나면 삭제</text>

<!-- infra/.state -->
<rect class="purple" x="24" y="360" width="812" height="90" rx="10"/>
<text x="40" y="386" class="mono">VPC_ID SUBNET_ID</text>
<text x="40" y="406" class="mono">IGW_ID RTB_ID</text>
<text x="40" y="426" class="mono">RTB_ASSOC_ID</text>
<text x="224" y="386" class="mono">SG_ID SSH_CIDR</text>
<text x="392" y="386" class="mono">KEY_NAME SSH_USER</text>
<text x="392" y="406" class="mono">INSTANCE_ID PUBLIC_IP</text>
<text x="600" y="390" class="mono tb c-purple">infra/.state</text>
<text x="600" y="411" class="ts">한 줄에 하나씩 KEY=VALUE</text>
<text x="600" y="430" class="ts">00_env.sh 의 state_set / state_get</text>

<!-- 테스트 -->
<rect class="zone" x="24" y="470" width="812" height="40" rx="10"/>
<text x="430" y="495" text-anchor="middle" class="ts">테스트·리허설: <tspan class="mono">tests/fake_aws.py</tspan> 가 PATH 맨 앞에서 aws 를 대신함 (네트워크로 나가지 않음)</text>
</svg>
