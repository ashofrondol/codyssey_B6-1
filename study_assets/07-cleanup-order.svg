<svg xmlns="http://www.w3.org/2000/svg" width="820" height="572" viewBox="0 0 820 572" role="img" aria-labelledby="title desc">
<title id="title">지우는 순서 — 만든 순서의 거꾸로</title>
<desc id="desc">왼쪽은 01~03 스크립트가 리소스를 만든 순서(VPC → Subnet → IGW → Route Table → Security Group → 키페어 → EC2)이고, 오른쪽은 99_cleanup.sh 가 지우는 순서다. 다른 것이 참조하고 있는 것부터 ①~⑨ 순으로 지우며(EC2 종료 → EBS → Elastic IP → SG → Route Table → IGW → Subnet → VPC → 키페어), 마지막 ⑩ 에서 태그 Project=codyssey-b6-1 로 8종을 다시 조회해 0개일 때만 .state 를 지우고 정리 완료, 하나라도 남으면 [LEFT] 를 찍고 종료 코드 1 로 끝난다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="820" height="572"/>
<text class="th" x="24" y="36">지우는 순서 — 만든 순서의 거꾸로 (99_cleanup.sh)</text>
<text class="ts" x="24" y="58">빨강 = 삭제 단계 · 보라 = 저장소·상태 · 초록 = 정리 완료</text>

<!-- 왼쪽: 만든 순서 -->
<text class="tb" x="24" y="90">만든 순서 (01→03)</text>
<rect class="box" x="24" y="104" width="172" height="30" rx="8"/>
<text x="110" y="124" text-anchor="middle">VPC</text>
<rect class="box" x="24" y="152" width="172" height="30" rx="8"/>
<text x="110" y="172" text-anchor="middle">Subnet</text>
<rect class="box" x="24" y="200" width="172" height="30" rx="8"/>
<text x="110" y="220" text-anchor="middle">IGW 연결</text>
<rect class="box" x="24" y="248" width="172" height="48" rx="8"/>
<text x="110" y="268" text-anchor="middle">Route Table</text>
<text x="110" y="287" text-anchor="middle" class="ts">경로 · 서브넷 연결</text>
<rect class="box" x="24" y="314" width="172" height="30" rx="8"/>
<text x="110" y="334" text-anchor="middle">Security Group</text>
<rect class="box" x="24" y="362" width="172" height="30" rx="8"/>
<text x="110" y="382" text-anchor="middle">키페어</text>
<rect class="box" x="24" y="410" width="172" height="30" rx="8"/>
<text x="110" y="430" text-anchor="middle">EC2 + 루트 EBS</text>
<line class="ln" x1="110" y1="135" x2="110" y2="148" marker-end="url(#arrow)"/>
<line class="ln" x1="110" y1="183" x2="110" y2="196" marker-end="url(#arrow)"/>
<line class="ln" x1="110" y1="231" x2="110" y2="244" marker-end="url(#arrow)"/>
<line class="ln" x1="110" y1="297" x2="110" y2="310" marker-end="url(#arrow)"/>
<line class="ln" x1="110" y1="345" x2="110" y2="358" marker-end="url(#arrow)"/>
<line class="ln" x1="110" y1="393" x2="110" y2="406" marker-end="url(#arrow)"/>

<!-- 가운데: 거꾸로 -->
<line class="ln" x1="204" y1="272" x2="268" y2="272" marker-end="url(#arrow)"/>
<text class="ts" x="236" y="260" text-anchor="middle">거꾸로</text>

<!-- 오른쪽: 지우는 순서 -->
<text class="tb" x="276" y="90">지우는 순서 (99_cleanup.sh)</text>
<rect class="red" x="276" y="104" width="272" height="30" rx="8"/>
<text x="290" y="124"><tspan class="tb c-red">①</tspan> EC2 종료(terminate) + 대기</text>
<rect class="red" x="276" y="144" width="272" height="30" rx="8"/>
<text x="290" y="164"><tspan class="tb c-red">②</tspan> 남은 EBS 삭제 (태그)</text>
<rect class="red" x="276" y="184" width="272" height="30" rx="8"/>
<text x="290" y="204"><tspan class="tb c-red">③</tspan> Elastic IP 해제 (태그)</text>
<rect class="red" x="276" y="224" width="272" height="30" rx="8"/>
<text x="290" y="244"><tspan class="tb c-red">④</tspan> Security Group 삭제</text>
<rect class="red" x="276" y="264" width="272" height="30" rx="8"/>
<text x="290" y="284"><tspan class="tb c-red">⑤</tspan> Route Table 연결 해제 → 삭제</text>
<rect class="red" x="276" y="304" width="272" height="30" rx="8"/>
<text x="290" y="324"><tspan class="tb c-red">⑥</tspan> IGW 분리(detach) → 삭제</text>
<rect class="red" x="276" y="344" width="272" height="30" rx="8"/>
<text x="290" y="364"><tspan class="tb c-red">⑦</tspan> Subnet 삭제</text>
<rect class="red" x="276" y="384" width="272" height="30" rx="8"/>
<text x="290" y="404"><tspan class="tb c-red">⑧</tspan> VPC 삭제</text>
<rect class="red" x="276" y="424" width="272" height="30" rx="8"/>
<text x="290" y="444"><tspan class="tb c-red">⑨</tspan> 키페어 삭제 + 로컬 .pem 삭제</text>
<line class="ln" x1="412" y1="455" x2="412" y2="466" marker-end="url(#arrow)"/>
<rect class="green" x="276" y="470" width="272" height="48" rx="8"/>
<text x="290" y="490"><tspan class="tb c-green">⑩</tspan> 태그로 잔여 8종 다시 조회</text>
<text x="318" y="509" class="mono">Project=codyssey-b6-1</text>

<!-- 옆 메모 -->
<line class="ln ln-purple" x1="549" y1="119" x2="567" y2="119"/>
<rect class="purple" x="568" y="94" width="228" height="50" rx="8"/>
<text x="682" y="114" text-anchor="middle" class="c-purple">루트 EBS 도 함께 삭제</text>
<text x="682" y="134" text-anchor="middle" class="mono">DeleteOnTermination=true</text>
<text x="568" y="164" class="ts">available(미사용) 볼륨만</text>
<text x="568" y="204" class="ts">이 실습은 할당 안 함 (있으면 해제)</text>

<line class="ln ln-red" x1="549" y1="399" x2="567" y2="399"/>
<rect class="red" x="568" y="330" width="228" height="90" rx="10"/>
<text x="584" y="352" class="tb c-red">순서를 어기면?</text>
<text x="584" y="373">예: VPC 부터 지우면</text>
<text x="584" y="393" class="mono">DependencyViolation</text>
<text x="584" y="412">으로 거부된다</text>

<!-- ⑩ 갈래 -->
<path class="ln ln-green" d="M549,486 H560 V460 H572" marker-end="url(#arrow-green)"/>
<rect class="green" x="576" y="438" width="220" height="46" rx="8"/>
<text x="590" y="460" class="tb c-green">0개 → 정리 완료</text>
<text x="590" y="477" class="ts">.state 파일도 삭제</text>
<path class="ln ln-red" d="M549,504 H560 V525 H572" marker-end="url(#arrow-red)"/>
<rect class="red" x="576" y="502" width="220" height="46" rx="8"/>
<text x="590" y="524" class="tb c-red">하나라도 남음</text>
<text x="590" y="541" class="ts">[LEFT] 출력 · 종료 코드 1</text>
</svg>
